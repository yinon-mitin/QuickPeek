name: QuickPeek

options:
  bundleIdPrefix: io.github.yinon-mitin
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    # Ad-hoc signing for local builds. The hardened runtime's library validation only accepts
    # frameworks signed by the same Team ID, which ad-hoc signatures do not have, so it is
    # enabled together with a Developer ID for notarized releases:
    #   xcodebuild ... CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM=<team> ENABLE_HARDENED_RUNTIME=YES
    # The extensions stay sandboxed either way.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
    # Extensions live in Contents/PlugIns/X.appex/Contents/MacOS and load QuickPeekKit from
    # the app's Contents/Frameworks.
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"

packages:
  QuickPeek:
    path: .

targets:
  QuickPeek:
    type: application
    platform: macOS
    sources:
      - App
      # Preview UI is shared so the app can show it in a window (--play, --snapshot) for debugging.
      - PreviewExtension/PlayerView.swift
      - PreviewExtension/StructuredPreviews.swift
      - PreviewExtension/InfoPanel.swift
      - PreviewExtension/AppPackagePreview.swift
      - path: Vendor
        type: folder
        buildPhase: resources
    dependencies:
      - target: QuickPeekPreview
      - target: QuickPeekThumbnail
      - target: QuickPeekFinderSync
      - package: QuickPeek
        product: QuickPeekKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yinon-mitin.QuickPeek
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QuickPeek
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Yinon Mitin. MIT License.
        # Types macOS only knows as dynamic UTIs; declaring them lets the extension claim them.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.kotlinlang.kotlin-source
            UTTypeDescription: Kotlin Source
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [kt, kts]
          - UTTypeIdentifier: org.gradle.gradle-script
            UTTypeDescription: Gradle Script
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [gradle]
          - UTTypeIdentifier: org.graphql.graphql
            UTTypeDescription: GraphQL Document
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [graphql, gql]
          - UTTypeIdentifier: com.apple.xcode.archive
            UTTypeDescription: Xcode Archive
            UTTypeConformsTo: [com.apple.package, public.directory]
            UTTypeTagSpecification:
              public.filename-extension: [xcarchive]
          - UTTypeIdentifier: com.hashicorp.terraform
            UTTypeDescription: Terraform Configuration
            UTTypeConformsTo: [public.source-code, public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [tf, tfvars, hcl]
    # The host app is not sandboxed: its --render/--snapshot modes read files given on the command line.
    # Only the Quick Look extension, which renders untrusted files, has to run in the sandbox.

  QuickPeekPreview:
    type: app-extension
    platform: macOS
    sources:
      - PreviewExtension
      - path: Vendor
        type: folder
        buildPhase: resources
    dependencies:
      - package: QuickPeek
        product: QuickPeekKit
        embed: false
      - sdk: Quartz.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yinon-mitin.QuickPeek.Preview
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: PreviewExtension/Info.plist
      properties:
        CFBundleDisplayName: QuickPeek Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              # Config and data
              - public.yaml
              - public.json
              - org.json.jsonc
              - public.toml
              - com.microsoft.ini
              - public.xml
              - public.properties
              # Source code
              - public.swift-source
              - public.python-script
              - public.shell-script
              - public.bash-script
              - public.zsh-script
              - public.ruby-script
              - public.perl-script
              - public.php-script
              - com.netscape.javascript-source
              - public.tsx
              - org.go.source
              - org.rust-lang.rust
              - public.c-source
              - public.c-header
              - public.c-plus-plus-source
              - public.c-plus-plus-header
              - public.objective-c-source
              - public.objective-c-plus-plus-source
              - com.sun.java-source
              - com.microsoft.csharp-source
              - org.lua.lua-source
              - org.iso.sql
              - public.css
              - com.barebones.bbedit.scss-source
              - com.docker.dockerfile
              - public.protobuf-source
              - public.patch-file
              - public.make-source
              - org.kotlinlang.kotlin-source
              - org.gradle.gradle-script
              - org.graphql.graphql
              - com.hashicorp.terraform
              # Documents and tables
              - net.daringfireball.markdown
              - com.unknown.md
              - public.comma-separated-values-text
              - public.tab-separated-values-text
              - public.utf8-tab-separated-values-text
              - org.jupyter.ipynb
              # Plain text and logs
              - public.plain-text
              - com.apple.log
              # Matroska/WebM video, including the identifiers video players export for them
              - org.matroska.mkv
              - org.matroska.mka
              - org.webmproject.webm
              - io.iina.mkv
              - io.iina.webm
              - io.mpv.mkv
              - io.mpv.webm
              - org.videolan.mkv
              - org.videolan.webm
              # Archives (listed with the system libarchive) and torrents
              - public.zip-archive
              - com.sun.java-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - public.tar-bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - org.tukaani.lzma-archive
              - public.z-archive
              - com.rarlab.rar-archive
              - org.7-zip.7-zip-archive
              - public.iso-image
              - public.cpio-archive
              - com.apple.xar-archive
              - com.microsoft.cab
              - public.archive.lha
              - org.bittorrent.torrent
              # App packages
              - com.apple.itunes.ipa
              - public.archive.apk
              - com.google.android.apk
              - com.apple.xcode.archive
    entitlements:
      path: PreviewExtension/QuickPeekPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # Lets JavaScriptCore compile highlight.js under the hardened runtime (about twice as fast).
        # The extension has no network access.
        com.apple.security.cs.allow-jit: true

  QuickPeekThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - ThumbnailExtension
    dependencies:
      - package: QuickPeek
        product: QuickPeekKit
        embed: false
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yinon-mitin.QuickPeek.Thumbnail
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ThumbnailExtension/Info.plist
      properties:
        CFBundleDisplayName: QuickPeek Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes:
              # Matroska/WebM, including the identifiers video players export for them
              - org.matroska.mkv
              - org.webmproject.webm
              - io.iina.mkv
              - io.iina.webm
              - io.mpv.mkv
              - io.mpv.webm
              - org.videolan.mkv
              - org.videolan.webm
              # App packages show their own icon
              - com.apple.itunes.ipa
              - public.archive.apk
              - com.google.android.apk
              - com.apple.xcode.archive
    entitlements:
      path: ThumbnailExtension/QuickPeekThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true

  QuickPeekFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - FinderSyncExtension
    dependencies:
      - package: QuickPeek
        product: QuickPeekKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yinon-mitin.QuickPeek.FinderSync
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: FinderSyncExtension/Info.plist
      properties:
        CFBundleDisplayName: QuickPeek Info
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    entitlements:
      path: FinderSyncExtension/QuickPeekFinderSync.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Finder Sync extensions get no file access of their own; reading the selected file's
        # details needs read-only access to the file system. Nothing is ever written.
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
