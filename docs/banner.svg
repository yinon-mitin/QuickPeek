<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">QuickPeek</title>
  <desc id="desc">The QuickPeek steel icon beside the wordmark and the file types it previews.</desc>
  <defs>
    <linearGradient id="banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f37"/><stop offset=".55" stop-color="#1a1e24"/><stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="banner-steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/><stop offset=".5" stop-color="#c3c9d1"/><stop offset="1" stop-color="#e8ebef"/>
    </linearGradient>
    <clipPath id="banner-clip"><rect width="1600" height="520" rx="34"/></clipPath>
    <filter id="banner-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1600" height="520" rx="34" fill="url(#banner-bg)"/>
  <g clip-path="url(#banner-clip)">
    <circle cx="1380" cy="40" r="260" fill="#c9d4e0" opacity=".07" filter="url(#banner-soft)"/>
    <circle cx="300" cy="520" r="260" fill="#8fa3b8" opacity=".08" filter="url(#banner-soft)"/>
    <path d="M0 448 C320 380 520 488 820 430 S1260 372 1600 440" fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="2"/>
  </g>
  <svg x="70" y="70" width="380" height="380" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="q-brushed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/><stop offset=".22" stop-color="#d3d8de"/>
      <stop offset=".48" stop-color="#eef1f4"/><stop offset=".72" stop-color="#b7bec7"/>
      <stop offset="1" stop-color="#dde1e6"/>
    </linearGradient>
    <linearGradient id="q-gunmetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a414b"/><stop offset=".55" stop-color="#22272e"/><stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <linearGradient id="q-chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".28" stop-color="#9aa3ad"/>
      <stop offset=".5" stop-color="#f6f8fa"/><stop offset=".74" stop-color="#5d6672"/>
      <stop offset="1" stop-color="#e3e7eb"/>
    </linearGradient>
    <radialGradient id="q-glass" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#4a5868"/><stop offset=".45" stop-color="#1c232c"/><stop offset="1" stop-color="#090b0e"/>
    </radialGradient>
    <radialGradient id="q-sheen" cx=".3" cy=".18" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="q-grain" width="8" height="3" patternUnits="userSpaceOnUse">
      <rect width="8" height="1" fill="#ffffff" opacity=".22"/><rect y="2" width="5" height="1" fill="#5d6672" opacity=".10"/>
    </pattern>
    <filter id="q-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <filter id="q-inner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="q-tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#q-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#q-brushed)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#q-grain)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#q-sheen)" opacity=".5"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
  </g>
  <g transform="translate(0 6)" opacity=".5">
    <circle cx="486" cy="486" r="190" fill="none" stroke="#fff" stroke-width="64"/>
    <path d="M620 620 L770 770" stroke="#fff" stroke-width="72" stroke-linecap="round"/>
  </g>
  <circle cx="486" cy="486" r="190" fill="none" stroke="url(#q-gunmetal)" stroke-width="64"/>
  <path d="M620 620 L770 770" stroke="url(#q-gunmetal)" stroke-width="72" stroke-linecap="round"/>
  <circle cx="486" cy="486" r="150" fill="url(#q-glass)" opacity=".12"/>
</svg>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="516" y="230" font-size="104" font-weight="700" letter-spacing="-2" fill="url(#banner-steel)">QuickPeek</text>
    <text x="520" y="296" font-size="32" font-weight="400" fill="#aab2bd">Quick Look for the files macOS leaves blank.</text>
    <g transform="translate(520 352)"><rect width="61" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="30.5" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">MKV</text></g><g transform="translate(591 352)"><rect width="74" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="37.0" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">WebM</text></g><g transform="translate(675 352)"><rect width="61" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="30.5" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">ZIP</text></g><g transform="translate(746 352)"><rect width="61" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="30.5" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">RAR</text></g><g transform="translate(817 352)"><rect width="48" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="24.0" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">7z</text></g><g transform="translate(875 352)"><rect width="74" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="37.0" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">Code</text></g><g transform="translate(959 352)"><rect width="126" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="63.0" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">Markdown</text></g><g transform="translate(1095 352)"><rect width="61" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="30.5" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">CSV</text></g><g transform="translate(1166 352)"><rect width="61" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="30.5" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">APK</text></g><g transform="translate(1237 352)"><rect width="61" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="30.5" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">IPA</text></g><g transform="translate(1308 352)"><rect width="113" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".16"/><text x="56.5" y="26" text-anchor="middle" font-size="18" font-weight="500" fill="#c9ced6">Torrent</text></g>
  </g>
</svg>
