name: Release

# Push a tag such as v0.6.0: the app is built, zipped and attached to a GitHub release whose
# notes come from CHANGELOG.md, and the Homebrew cask in yinon-mitin/homebrew-tap is updated
# (when the TAP_TOKEN secret is set: a fine-grained token with Contents write access to that repo).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test and build
        run: script/build.sh

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="QuickPeek-$version.zip"
          ditto -c -k --sequesterRsrc --keepParent build/QuickPeek.app "$zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Release notes from the changelog
        run: |
          awk -v version="${{ steps.package.outputs.version }}" '
            index($0, "## " version " ") == 1 { found = 1; next }
            /^## / && found { exit }
            found
          ' CHANGELOG.md > notes.md
          printf '\n**Install:** `brew install --cask yinon-mitin/tap/quickpeek`, or download the zip below.\n' >> notes.md
          printf 'QuickPeek is not notarized: on first launch, allow it in System Settings → Privacy & Security.\n' >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "QuickPeek ${{ steps.package.outputs.version }}" --notes-file notes.md

      - name: Update the Homebrew cask
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/yinon-mitin/homebrew-tap.git" tap
          cd tap
          sed -i '' \
            -e 's/^  version ".*"/  version "${{ steps.package.outputs.version }}"/' \
            -e 's/^  sha256 ".*"/  sha256 "${{ steps.package.outputs.sha256 }}"/' \
            Casks/quickpeek.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "quickpeek ${{ steps.package.outputs.version }}"
          git push
